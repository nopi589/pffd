<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - PFFD</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p-green: #2d5a27; --a-green: #8bc34a; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; padding: 20px; }
        .container-box { background: white; max-width: 500px; margin: 30px auto; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: var(--p-green); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--p-green); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        .hidden { display: none; }
        
        /* ستايل قائمة المسح */
        .activity-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #f9f9f9; padding: 12px; margin-bottom: 8px; 
            border-radius: 8px; border: 1px solid #eee;
        }
        .btn-delete { background: #e74c3c; width: auto; padding: 6px 15px; font-size: 0.8rem; }
        .divider { border-top: 2px solid #eee; margin: 30px 0; }
    </style>
</head>
<body>

    <div id="login-section" class="container-box">
        <h2>دخول الإدارة</h2>
        <input type="password" id="admin-pass" placeholder="كلمة السر">
        <button onclick="checkPass()">دخول</button>
    </div>

    <div id="admin-section" class="container-box hidden">
        <h2>إضافة نشاط جديد</h2>
        <input type="text" id="title" placeholder="عنوان النشاط">
        <input type="text" id="date" placeholder="التاريخ (مثلا: 17 مارس 2026)">
        <input type="text" id="image" placeholder="رابط الصورة (URL)">
        <textarea id="desc" rows="3" placeholder="وصف قصير للنشاط"></textarea>
        <input type="text" id="link" placeholder="رابط الصفحة (activity6.html)">
        <button id="submit-btn" onclick="uploadActivity()">نشر النشاط الآن</button>
        <p id="msg" style="text-align:center; margin-top:10px; font-weight: bold;"></p>

        <div class="divider"></div>

        <h3>الأنشطة الحالية</h3>
        <div id="delete-list">
            <p style="text-align:center; color:#999;">جاري تحميل الأنشطة...</p>
        </div>
    </div>

    <script>
        // --- 1. إعدادات Supabase ---
        // حط الروابط ديالك هنا
        const SUPABASE_URL = 'https://msohqcwfxvybrsegbdvt.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zb2hxY3dmeHZ5YnJzZWdiZHZ0Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3MzcwMzMzNCwiZXhwIjoyMDg5Mjc5MzM0fQ.W9KVNXvFMCNyMIorwY6E00Qdcm-Jm0528qw2eyNC5EA';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2. التحقق من كلمة السر ---
        function checkPass() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === '123456') { 
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                loadForDelete(); // تحميل الأنشطة بمجرد الدخول
            } else { 
                alert('كلمة سر خاطئة!'); 
            }
        }

        // --- 3. وظيفة نشر نشاط جديد ---
        async function uploadActivity() {
            const btn = document.getElementById('submit-btn');
            const msg = document.getElementById('msg');
            
            btn.innerText = 'جاري النشر...';
            btn.disabled = true;
            
            const { data, error } = await _supabase.from('activities').insert([{
                title: document.getElementById('title').value,
                date: document.getElementById('date').value,
                image_url: document.getElementById('image').value,
                description: document.getElementById('desc').value,
                link: document.getElementById('link').value
            }]);

            if (error) {
                alert('خطأ في النشر: ' + error.message);
                console.log(error);
            } else {
                msg.style.color = "green";
                msg.innerText = '✅ تم النشر بنجاح!';
                // خوي الخانات
                document.querySelectorAll('#admin-section input, #admin-section textarea').forEach(i => i.value = '');
                loadForDelete(); // تحديث القائمة باش يبان الجديد
            }
            btn.innerText = 'نشر النشاط الآن';
            btn.disabled = false;
        }

        // --- 4. وظيفة تحميل قائمة الأنشطة للمسح ---
        async function loadForDelete() {
            const listDiv = document.getElementById('delete-list');
            const { data: activities, error } = await _supabase
                .from('activities')
                .select('id, title')
                .order('id', { ascending: false });

            if (error) {
                listDiv.innerHTML = '<p style="color:red;">خطأ في تحميل القائمة</p>';
                return;
            }

            if (activities.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#999;">لا توجد أنشطة حالياً</p>';
                return;
            }

            listDiv.innerHTML = '';
            activities.forEach(act => {
                listDiv.innerHTML += `
                    <div class="activity-item">
                        <span style="font-weight:500;">${act.title}</span>
                        <button class="btn-delete" onclick="deleteActivity(${act.id})">حذف</button>
                    </div>
                `;
            });
        }

        // --- 5. وظيفة حذف نشاط ---
        async function deleteActivity(id) {
            if(confirm('واش بصح بغيتي تمسح هاد النشاط؟ هاد العملية مافيهاش الرجوع!')) {
                const { error } = await _supabase.from('activities').delete().eq('id', id);
                if(error) {
                    alert('خطأ في الحذف: ' + error.message);
                } else {
                    alert('تم الحذف بنجاح!');
                    loadForDelete(); // تحديث القائمة
                }
            }
        }
    </script>
</body>
</html>
